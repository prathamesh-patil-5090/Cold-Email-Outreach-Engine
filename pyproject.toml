[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outreach-engine"
version = "0.1.0"
description = "Verify, assemble, and send the Outreach Tracker sequence from Google Sheets."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "email-validator>=2.2.0",
  "dnspython>=2.6.1",
  "google-api-python-client>=2.149.0",
  "google-auth>=2.35.0",
  "PyYAML>=6.0.2",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
outreach = "outreach.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
